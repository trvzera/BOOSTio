services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      - traefik.enable=false
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - traefik.enable=false
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: producao
      GUNICORN_BIND: 0.0.0.0:8000
      TRUSTED_PROXY_HOPS: "1"
      TRUSTED_PROXY_PROTO_HOPS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host':'api.boostio.com.br'}); urllib.request.urlopen(r, timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 4
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.boostio-api.rule=Host(`api.boostio.com.br`)
      - traefik.http.routers.boostio-api.entrypoints=websecure
      - traefik.http.routers.boostio-api.tls=true
      - traefik.http.routers.boostio-api.tls.certresolver=letsencrypt
      - traefik.http.routers.boostio-api.service=boostio-api
      - traefik.http.routers.boostio-api.middlewares=boostio-api-security
      - traefik.http.services.boostio-api.loadbalancer.server.port=8000
      - traefik.http.middlewares.boostio-api-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.boostio-api-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.boostio-api-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.boostio-api-security.headers.frameDeny=true
      - traefik.http.middlewares.boostio-api-security.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.boostio-api-security.headers.customResponseHeaders.Permissions-Policy=camera=(), microphone=(), geolocation=()
    networks: [backend, traefik-proxy]

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        API_PUBLIC_URL: https://api.boostio.com.br
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.boostio-web.rule=Host(`boostio.com.br`)
      - traefik.http.routers.boostio-web.entrypoints=websecure
      - traefik.http.routers.boostio-web.tls=true
      - traefik.http.routers.boostio-web.tls.certresolver=letsencrypt
      - traefik.http.routers.boostio-web.service=boostio-web
      - traefik.http.routers.boostio-web.middlewares=boostio-web-security
      - traefik.http.services.boostio-web.loadbalancer.server.port=80
      - traefik.http.middlewares.boostio-web-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.boostio-web-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.boostio-web-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.boostio-web-security.headers.frameDeny=true
      - traefik.http.middlewares.boostio-web-security.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.boostio-web-security.headers.customResponseHeaders.Permissions-Policy=camera=(), microphone=(), geolocation=()
    networks: [traefik-proxy]

volumes:
  mysql_data:
  redis_data:

networks:
  backend:
    internal: true
  traefik-proxy:
    external: true
