map $uri $pagina_legada {
    default "";
    /index.html /;
    /pages/index.html /;
    ~^/(?:pages/)?(login|signin|esqueci-senha|reset-senha|formulario|builds|configuracoes|configuracoes-prontas|configuracao-build|pecas|peca|sobre|termos|erro|testes)\.html$ /$1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # O HTTPS termina no Traefik; não gerar Location com o HTTP/host internos.
    absolute_redirect off;

    # Mantém links antigos e parâmetros de compartilhamento sem duplicar páginas.
    if ($pagina_legada != "") {
        return 301 $pagina_legada$is_args$args;
    }

    location = / {
        try_files /pages/index.html =404;
    }

    location = /testes { try_files /testes.html =404; }

    location / {
        try_files $uri /pages$uri.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
