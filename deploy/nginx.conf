server {
    listen 80;
    server_name _;
    # Preserve HTTPS e a porta pública quando estiver atrás do proxy.
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = / {
        return 302 /pages/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /coletados/imagens-produtos.json {
        add_header Cache-Control "no-store";
        try_files $uri @manifesto_vazio;
    }

    location @manifesto_vazio {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{}';
    }

    location /coletados/ {
        autoindex off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
