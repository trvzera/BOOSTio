<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Montar sua builds</title>
  <link rel="icon" type="image/x-icon" href="../imgs/favicon.webp">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta name="description" content="A Boostio é uma plataforma que simplifica a montagem de computadores,
  ajudando você a escolher as peças ideais com base no seu objetivo,
  orçamento e necessidade, tudo com precisão e confiança.">
  <script type="module" src="../js/pages/loading.js" defer></script>
  <script type="module" src="../js/pages/forms.js"></script>
</head>

<body class="form-page">
  <div id="loading-screen">
    <video id="loading-video" autoplay muted playsinline>
      <source src="../video/loading-toggle.webm" type="video/webm">
    </video>
  </div>
  <div data-site-navigation></div>

  <main id="forms-page">

    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div id="forms-page-container">

      <a href="./index.html" class="btn-ghost form-page-back" data-page-back aria-label="Voltar ao início">
        <span class="ui-lottie" data-lottie="arrow" data-direction="back" aria-hidden="true"><span class="ui-icon-fallback">→</span></span>
        <span data-back-label>Voltar ao início</span>
      </a>

      <nav id="forms-header" aria-label="Navegação entre etapas do formulário">
        <button type="button" class="form-step active" data-step="0" aria-label="01 Objetivo: ir para a etapa 1"><span class="form-step-number font-1-xs">01</span><span class="font-1-xs">Objetivo</span></button>
        <div class="form-bar" data-bar="0"></div>
        <button type="button" class="form-step" data-step="1" aria-label="02 Orçamento: ir para a etapa 2"><span class="form-step-number font-1-xs">02</span><span class="font-1-xs">Orçamento</span></button>
        <div class="form-bar" data-bar="1"></div>
        <button type="button" class="form-step" data-step="2" aria-label="03 Suas peças: ir para a etapa 3"><span class="form-step-number font-1-xs">03</span><span class="font-1-xs">Suas peças</span></button>
      </nav>

      <section id="questions">

        <aside id="question-info">
        </aside>

        <section id="question-content" aria-live="polite" aria-label="Perguntas para montar seu computador">
        </section>

      </section>

    </div>

  </main>
</body>

</html>
