<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Montar sua builds</title>
  <link rel="icon" type="image/x-icon" href="../imgs/favicon.webp">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta name="description" content="A Boostio é uma plataforma que simplifica a montagem de computadores,
  ajudando você a escolher as peças ideais com base no seu objetivo,
  orçamento e necessidade, tudo com precisão e confiança.">
  <script type="module" src="../js/pages/loading.js" defer></script>
  <script type="module" src="../js/pages/forms.js"></script>
</head>

<body class="form-page">
  <div id="loading-screen">
    <video id="loading-video" autoplay muted playsinline>
      <source src="../video/loading-toggle.webm" type="video/webm">
    </video>
  </div>
  <header id="header">
    <div id="header-container">
      <a href="./index.html" id="logo" aria-label="Logo da BOOSTio" width="100" height="20"></a>
      <nav id="header-nav">
        <ul id="nav-list">
          <li class="nav-item"><a href="./index.html#main-page" class="nav-link font-1-xs" aria-label="Ir para sessão de inicial">Início</a></li>
          <li class="nav-item"><a href="./index.html#about-page" class="nav-link font-1-xs" aria-label="Ir para sessão sobre">Sobre</a></li>
          <li class="nav-item"><a href="./index.html#services-page" class="nav-link font-1-xs" aria-label="Ir para sessão de serviços">Serviços</a></li>
          <li class="nav-item"><a href="./index.html#build-page" class="nav-link font-1-xs" aria-label="Ir para sessão de montagem do computador">Monte o seu</a></li>
          <li id="divider"></li>
          <li class="nav-item"><a href="./builds.html" class="nav-link font-1-xs" aria-label="Ir para página contendo suas builds">Suas Builds</a></li>
        </ul>
      </nav>
      <div id="profile">
        <input type="checkbox" name="profile" id="profile-check" aria-label="Abrir menu do perfil">
        <div id="profile-options">
          <nav id="profile-nav">
            <ul class="profile-nav-list" id="profile-nav-list-signed-in">
              <li class="profile-item">
                <a href="./builds.html" class="profile-link font-1-s" id="btn-build" aria-label="Ir para suas builds">
                  <i id="lottie-build" class="lottie-header"></i>
                  <p>Builds</p>
                </a>
              </li>
              <li class="profile-item">
                <a href="./configuracoes.html" class="profile-link font-1-s" id="btn-user" aria-label="Ir para as Configurações do seu perfil">
                  <i id="lottie-user" class="lottie-header"></i>
                  <p>Configurações</p>
                </a>
              </li>
              <li class="profile-item sign-out-item">
                <a href="#" class="profile-link font-1-s" id="btn-logout" aria-label="Sair da sua conta">
                  <i id="lottie-logout" class="lottie-header"></i>
                  <p>Sair</p>
                </a>
              </li>
            </ul>
            <ul class="profile-nav-list" id="profile-nav-list-signed-out">
              <li class="profile-item"><a href="./login.html" class="profile-link font-1-s" id="btn-login" aria-label="Entrar na sua conta"><i id="lottie-login" class="lottie-header"></i>
                  <p>Entrar</p>
                </a></li>
              <li class="profile-item"><a href="./signin.html" class="profile-link font-1-s" id="btn-logon" aria-label="Criar uma conta"><i id="lottie-logon" class="lottie-header"></i>
                  <p>Criar conta</p>
                </a></li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <header id="header-mobile">
    <div id="burger-menu">
      <input type="checkbox" id="burger-check" aria-label="Abrir menu de navegação">
      <label for="burger-check" id="lottie-burger">
      </label>

      <nav id="mobile-nav">
        <ul id="mobile-nav-list">
          <li class="mobile-nav-item"><a href="./index.html#main-page" class="nav-link font-1-xs" aria-label="Ir para sessão de Início">Início</a></li>
          <li class="mobile-nav-item"><a href="./index.html#about-page" class="nav-link font-1-xs" aria-label="Ir para sessão Sobre">Sobre</a></li>
          <li class="mobile-nav-item"><a href="./index.html#services-page" class="nav-link font-1-xs" aria-label="Ir para sessão de Serviços">Serviços</a></li>
          <li class="mobile-nav-item"><a href="./index.html#build-page" class="nav-link font-1-xs" aria-label="Ir para sessão montar o computador">Monte o seu</a></li>
          <li class="mobile-nav-item"><a href="./builds.html" class="nav-link font-1-xs" aria-label="Ir para página das suas builds">Suas Builds</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="forms-page">

    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div id="forms-page-container">

      <nav id="forms-header" aria-label="Navegação entre etapas do formulário">
        <button type="button" class="form-step active" data-step="0"><span class="form-step-number font-1-xs">01</span><span class="font-1-xs">Objetivo</span></button>
        <div class="form-bar" data-bar="0"></div>
        <button type="button" class="form-step" data-step="1"><span class="form-step-number font-1-xs">02</span><span class="font-1-xs">Orçamento</span></button>
        <div class="form-bar" data-bar="1"></div>
        <button type="button" class="form-step" data-step="2"><span class="form-step-number font-1-xs">03</span><span class="font-1-xs">Suas peças</span></button>
      </nav>

      <section id="questions">

        <aside id="question-info">
        </aside>

        <section id="question-content" aria-live="polite" aria-label="Perguntas para montar seu computador">
        </section>

      </section>

    </div>

  </main>
</body>

</html>
