<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar sua conta</title>
  <link rel="icon" type="image/x-icon" href="../imgs/favicon.webp">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta name="description" content="A Boostio é uma plataforma que simplifica a montagem de computadores,
  ajudando você a escolher as peças ideais com base no seu objetivo,
  orçamento e necessidade, tudo com precisão e confiança.">
  <script type="module" src="../js/pages/loading.js" defer></script>
  <script type="module" src="../js/pages/signin.js" defer></script>
</head>

<body class="sign-up-page-body">
  <div id="loading-screen">
    <video id="loading-video" autoplay muted playsinline>
      <source src="../video/loading-toggle.webm" type="video/webm">
    </video>
  </div>
  <div data-site-navigation></div>

  <main id="signin-page">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div id="signin-container">
      <img src="../imgs/logo.webp" alt="Logo">
      <h1 id="signin-title" class="font-1-l">Vamos criar a sua conta!</h1>
      <p id="signin-description" class="font-2-xs">Já possui uma conta? <a href="./login.html">Entrar com sua conta.</a></p>
      <form id="signin-form">
        <input type="text" placeholder="Seu nome de usuário" class="input-text" id="username" maxlength="15">
        <input type="email" placeholder="Seu melhor e-mail" class="input-text" id="email">

        <div class="password-input-wrapper">
          <input type="password" placeholder="Uma senha forte" class="input-text" id="primary-password">
          <button type="button" class="password-toggle fa-eye-slash" data-target="primary-password" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m3 3 18 18"/></svg></button>
        </div>

        <div id="password-verification">
          <div id="password-verification-content">
            <div id="status-container">
              <div id="strength-meter-track">
                <div class="strength-meter-bar"></div>
              </div>
              <p class="font-1-s" id="status-text"></p>
            </div>
            <div id="password-rules">
              <div class="password-rule" id="password-length-rule">
                <div class="password-rule-status">
                  <i class="fa-solid fa-x"></i>
                  <i class="fa-solid fa-check"></i>
                </div>
                <p class="font-1-s">+8 Caracteres</p>
              </div>
              <div class="password-rule" id="symbol-rule">
                <div class="password-rule-status">
                  <i class="fa-solid fa-x"></i>
                  <i class="fa-solid fa-check"></i>
                </div>
                <p class="font-1-s">Símbolos</p>
              </div>
              <div class="password-rule" id="uppercase-rule">
                <div class="password-rule-status">
                  <i class="fa-solid fa-x"></i>
                  <i class="fa-solid fa-check"></i>
                </div>
                <p class="font-1-s">Maiúsculas</p>
              </div>
              <div class="password-rule" id="lowercase-rule">
                <div class="password-rule-status">
                  <i class="fa-solid fa-x"></i>
                  <i class="fa-solid fa-check"></i>
                </div>
                <p class="font-1-s">Minúsculas</p>
              </div>
              <div class="password-rule" id="number-rule">
                <div class="password-rule-status">
                  <i class="fa-solid fa-x"></i>
                  <i class="fa-solid fa-check"></i>
                </div>
                <p class="font-1-s">Números</p>
              </div>
            </div>
          </div>
        </div>

        <div class="password-input-wrapper">
          <input type="password" placeholder="Confirme sua senha" class="input-text" id="confirm-password">
          <button type="button" class="password-toggle fa-eye-slash" data-target="confirm-password" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m3 3 18 18"/></svg></button>
        </div>
        <p id="password-match-text" class="font-1-s"></p>

        <div id="terms-checkbox-field">
          <div class="checkbox-wrapper" id="terms-checkbox-animation">
            <input type="checkbox" name="terms" id="terms" class="lottie-check">
          </div>
          <label for="terms" class="font-1-xs">
            Li e concordo com os <a href="./termos.html" target="_blank">Termos e Condições</a>
          </label>

        </div>
        <p id="sign-up-error" class="font-1-xs form-error"></p>
        <button type="submit" class="btn-login" id="btn-create-account" disabled>Criar conta</button>
      </form>
      <div class="login-divider">
        <span class="login-line"></span>
        <p class="font-1-s">Ou se preferir</p>
        <span class="login-line"></span>
      </div>
      <a href="#" class="btn-login-secondary" id="btn-google-login">Criar com Google</a>
    </div>

    <div class="modal-overlay" id="verify-email-modal">
      <div class="modal-box" id="verify-email-box">
        <div class="modal-icon"><i class="fa-solid fa-envelope-circle-check"></i></div>
        <h3 class="font-1-m">Confirme seu e-mail</h3>
        <p class="font-1-m">Para ativar sua conta, envie o código de verificação para <strong id="verify-email-target">seu e-mail</strong> e digite os 4 dígitos recebidos abaixo.</p>

        <div id="send-code-container">
          <button type="button" class="btn-ghost" id="btn-send-code" aria-label="Enviar código de verificação para o e-mail">
            <i class="fa-solid fa-paper-plane"></i>
            Enviar código
          </button>
        </div>

        <div class="code-inputs" id="code-inputs">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-input" data-index="0" aria-label="Primeiro dígito do código" disabled>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-input" data-index="1" aria-label="Segundo dígito do código" disabled>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-input" data-index="2" aria-label="Terceiro dígito do código" disabled>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-input" data-index="3" aria-label="Quarto dígito do código" disabled>
        </div>

        <p id="verify-email-error" class="font-1-xs form-error"></p>

        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="btn-verify-later" aria-label="Verificar e-mail mais tarde">Fazer isso depois</button>
          <button type="button" class="btn-primary" id="btn-confirm-code" aria-label="Confirmar código de verificação" disabled>Confirmar</button>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
