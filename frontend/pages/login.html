<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na conta</title>
  <link rel="icon" type="image/x-icon" href="../imgs/favicon.webp">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta name="description" content="A Boostio é uma plataforma que simplifica a montagem de computadores,
  ajudando você a escolher as peças ideais com base no seu objetivo,
  orçamento e necessidade, tudo com precisão e confiança.">
  <script type="module" src="../js/pages/loading.js" defer></script>
  <script type="module" src="../js/pages/login.js" defer></script>
</head>

<body class="login-page-body">
  <div id="loading-screen">
    <video id="loading-video" autoplay muted playsinline>
      <source src="../video/loading-toggle.webm" type="video/webm">
    </video>
  </div>
  <div data-site-navigation></div>

  <main id="login-page">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div id="login-container">
      <img src="../imgs/logo.webp" alt="Logo">
      <h1 id="login-title" class="font-1-l">Bem-vindo(a) de volta!</h1>
      <p id="login-description" class="font-2-xs">Primeira vez aqui? <a href="./signin.html" aria-label="Crie uma conta! Abrir cadastro">Crie uma conta!</a></p>

      <form id="login-form">
        <input type="email" placeholder="Seu e-mail" class="input-text" id="email" required>
        <div class="password-input-wrapper">
          <input type="password" placeholder="Sua senha" class="input-text" id="password" required>
          <button type="button" class="password-toggle fa-eye-slash" data-target="password" aria-label="Mostrar senha" aria-pressed="false" aria-controls="password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m3 3 18 18"/></svg></button>
        </div>

        <p id="login-error" class="font-1-xs form-error"></p>
        <button type="submit" class="btn-login" id="btn-sign-in" aria-label="Entrar na conta" disabled>Entrar</button>
        <a href="./esqueci-senha.html" id="forgot-password-link" class="font-1-s" aria-label="Esqueceu a sua senha? Recuperar senha">Esqueceu a sua senha?</a>
      </form>
      <div class="login-divider">
        <span class="login-line"></span>
        <p class="font-1-s">Ou se preferir</p>
        <span class="login-line"></span>
      </div>
      <a href="#" class="btn-login-secondary" id="btn-google-login" aria-label="Entra com Google">Entra com Google</a>
    </div>
  </main>
</body>

</html>
