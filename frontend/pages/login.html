<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na conta — BOOSTio</title>
  <link rel="icon" type="image/webp" href="../imgs/favicon.webp">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="../imgs/apple-touch-icon.png">
  <meta name="theme-color" content="#101114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BOOSTio">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="../styles/style.css">
  <noscript><link rel="stylesheet" href="../styles/componentes/no-script.css"></noscript>
  <meta name="description" content="Entre na sua conta BOOSTio para acessar suas builds, seu orçamento e as ferramentas de montagem de computadores.">
  <meta name="robots" content="noindex,follow">
  <link rel="preload" href="../fonts/Lexend%5Bwght%5D.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" src="../js/pages/loading.js"></script>
  <script type="module" src="../js/pages/login.js"></script>
</head>

<body class="login-page-body">
  <a class="skip-link" href="#login-page" aria-label="Pular para o conteúdo principal">Pular para o conteúdo principal</a>
  <div id="loading-screen">
    <video id="loading-video" width="1000" height="1000" autoplay muted playsinline aria-hidden="true" tabindex="-1">
      <source src="../video/loading-toggle.webm" type="video/webm">
    </video>
  </div>
  <div data-site-navigation></div>

  <main id="login-page" tabindex="-1">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div id="login-container">
      <img src="../imgs/logo.webp" alt="Logo" width="668" height="237" decoding="async">
      <h1 id="login-title" class="font-1-l">Bem-vindo(a) de volta!</h1>

      <form id="login-form" method="post">
        <label class="sr-only" for="email" data-login-first-step>Seu e-mail</label>
        <input type="email" name="email" autocomplete="username" placeholder="Seu e-mail" class="input-text" id="email" required data-login-first-step>
        <div class="password-input-wrapper" data-login-first-step>
          <label class="sr-only" for="password">Sua senha</label>
          <input type="password" name="password" autocomplete="current-password" placeholder="Sua senha" class="input-text" id="password" required aria-describedby="login-error">
          <button type="button" class="password-toggle fa-eye-slash" data-target="password" aria-label="Mostrar senha" aria-pressed="false" aria-controls="password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m3 3 18 18"/></svg></button>
        </div>

        <div id="admin-factor" hidden>
          <p id="admin-code-help">Abra o aplicativo autenticador e digite o código de 6 dígitos da BOOSTio.</p>
          <label for="admin-code">Código do autenticador</label>
          <input class="input-text" id="admin-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" aria-describedby="admin-code-help login-error" disabled>
        </div>
        <p id="login-error" class="font-1-xs form-error" role="alert"></p>
        <button type="submit" class="btn-login" id="btn-sign-in" aria-label="Entrar na conta" disabled>Entrar</button>
        <a href="./esqueci-senha.html" id="forgot-password-link" class="font-1-s" aria-label="Esqueceu a sua senha? Recuperar senha" data-login-first-step>Esqueceu a sua senha?</a>
        <a href="./login.html" id="admin-factor-back" class="font-1-s" aria-label="Voltar ao login" hidden>Voltar ao login</a>
      </form>
      <div class="login-divider" data-login-first-step>
        <span class="login-line"></span>
        <p class="font-1-s">Ou se preferir</p>
        <span class="login-line"></span>
      </div>
      <a href="#" class="btn-login-secondary" id="btn-google-login" aria-label="Entrar com Google" data-login-first-step>Entrar com Google</a>
      <p id="login-description" class="font-2-xs" data-login-first-step>Ainda não tem uma conta? <a href="./signin.html" aria-label="Criar conta na BOOSTio">Criar conta</a></p>
    </div>
  </main>
</body>

</html>
