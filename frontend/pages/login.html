<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na conta</title>
  <link rel="icon" type="image/x-icon" href="../imgs/favicon.webp">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta name="description" content="A Boostio é uma plataforma que simplifica a montagem de computadores,
  ajudando você a escolher as peças ideais com base no seu objetivo,
  orçamento e necessidade, tudo com precisão e confiança.">
  <script type="module" src="../js/pages/login.js" defer></script>
</head>

<body id="login">

  <header id="header">
    <div id="header-container">
      <a href="../index.html" id="logo" aria-label="Logo da BOOSTio"></a>
      <nav id="header-nav">
        <ul id="nav-list">
          <li class="nav-item"><a href="../index.html" class="nav-link font-1-xs" aria-label="Ir para página principal na sessão de inicial">Início</a></li>
          <li class="nav-item"><a href="../index.html#about-page" class="nav-link font-1-xs" aria-label="Ir para página principal na sessão sobre">Sobre</a></li>
          <li class="nav-item"><a href="#" class="nav-link font-1-xs" aria-label="Ir para página principal na sessão de serviços">Serviços</a></li>
          <li class="nav-item"><a href="#" class="nav-link font-1-xs" aria-label="Ir para página principal na sessão de montagem do computador">Monte o seu</a></li>
          <li id="divider"></li>
          <li class="nav-item"><a href="#" class="nav-link font-1-xs" aria-label="Ir para página contendo suas builds">Suas Builds</a></li>
        </ul>
      </nav>
      <div id="profile">
        <input type="checkbox" name="profile" id="profile-check" aria-label="Abrir menu do perfil">
        <div id="profile-options">
          <nav id="profile-nav">
            <ul class="profile-nav-list" id="profile-nav-list-logado">
              <li class="profile-item"><a href="#" class="profile-link font-1-s" aria-label="Ir para suas builds"><i class="fa-solid fa-floppy-disk"></i>
                  <p>Builds</p>
                </a></li>
              <li class="profile-item"><a href="./configuracoes.html" class="profile-link font-1-s" aria-label="Ir para as Configurações do seu perfil"><i class="fa-solid fa-user-gear"></i>
                  <p>Configurações</p>
                </a></li>
              <li class="profile-item sair"><a href="#" class="profile-link font-1-s" id="btn-sair" aria-label="Sair da sua conta"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                  <p>Sair</p>
                </a></li>
            </ul>

            <ul class="profile-nav-list" id="profile-nav-list-deslogado">
              <li class="profile-item"><a href="./login.html" class="profile-link font-1-s" aria-label="Entrar na sua conta"><i class="fa-solid fa-arrow-right-to-bracket"></i>
                  <p>Entrar</p>
                </a></li>
              <li class="profile-item"><a href="./signin.html" class="profile-link font-1-s" aria-label="Criar uma conta"><i class="fa-solid fa-user-plus"></i>
                  <p>Criar conta</p>
                </a></li>
            </ul>
          </nav>
        </div>
        <i class="fa-solid fa-user" id="profile-icon"></i>
      </div>
    </div>
  </header>

  <header id="header-mobile">
    <div id="burger-menu">
      <input type="checkbox" id="burger-check">
      <label for="burger-check" id="burger-icon">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav id="mobile-nav">
        <ul id="mobile-nav-list">
          <li class="mobile-nav-item"><a href="../index.html#main-page" class="nav-link font-1-xs" aria-label="Ir para página principal na sessão de Início">Início</a></li>
          <li class="mobile-nav-item"><a href="../index.html#about-page" class="nav-link font-1-xs" aria-label="Ir para página principal na sessão Sobre">Sobre</a></li>
          <li class="mobile-nav-item"><a href="#" class="nav-link font-1-xs" aria-label="Ir para página principal na sessão de Serviços">Serviços</a></li>
          <li class="mobile-nav-item"><a href="#" class="nav-link font-1-xs" aria-label="Ir para página principal na sessão montar o computador">Monte o seu</a></li>
          <li class="mobile-nav-item"><a href="#" class="nav-link font-1-xs" aria-label="Ir para página das suas builds">Suas Builds</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="login-page">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div id="login-container">
      <img src="../imgs/logo.webp" alt="Logo">
      <h1 id="login-title" class="font-1-l">Bem-vindo(a) de volta!</h1>
      <p id="login-description" class="font-2-xs">Primeira vez aqui? <a href="./signin.html">Crie uma conta!</a></p>

      <form id="login-form">
        <input type="email" placeholder="Seu e-mail" class="input-text" id="email" required>
        <div class="input-senha-wrapper">
          <input type="password" placeholder="Sua senha" class="input-text" id="senha" required>
          <i class="fa-solid fa-eye-slash toggle-senha" data-target="senha"></i>
        </div>

        <p id="login-erro" class="font-1-xs erro-form"></p>
        <button type="submit" class="btn-login" id="btn-entrar" disabled>Entrar</button>
        <a href="#" id="esqueceu-senha" class="font-1-s">Esqueceu a sua senha?</a>
      </form>
    </div>
  </main>
</body>

</html>
