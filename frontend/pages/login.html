<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="../js/login.js" defer></script>
</head>

<body>
  <header id="header">
    <div id="header-container">
      <a href="../index.html" id="logo"></a>
      <nav id="header-nav">
        <ul id="nav-list">
          <li class="nav-item"><a href="../index.html" class="nav-link font-1-xs">Início</a></li>
          <li class="nav-item"><a href="#about-page" class="nav-link font-1-xs">Sobre</a></li>
          <li class="nav-item"><a href="#" class="nav-link font-1-xs">Serviços</a></li>
          <li class="nav-item"><a href="#" class="nav-link font-1-xs">Monte o seu</a></li>
          <span id="divider"></span>
          <li class="nav-item"><a href="#" class="nav-link font-1-xs">Suas Builds</a></li>
      </nav>
      <div id="profile">
        <input type="checkbox" name="profile" id="profile-check">
        <div id="profile-options">
          <nav id="profile-nav">
            <ul id="profile-nav-list">
              <li class="profile-item"><a href="" class="profile-link font-1-s"><i class="fa-regular fa-user"></i>
                  <p>Builds</p>
                </a></li>
              <li class="profile-item"><a href="" class="profile-link font-1-s"><i class="fa-regular fa-floppy-disk"></i>
                  <p>Configurações</p>
                </a></li>
              <li class="profile-item"><a href="" class="profile-link font-1-s"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                  <p>Sair</p>
                </a></li>
            </ul>
          </nav>
        </div>
        <i class="fa-solid fa-user" id="profile-icon"></i>
      </div>
    </div>
  </header>

  <main id="login-page">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div id="login-container">
      <img src="../imgs/logo.png" alt="Logo">
      <h1 id="login-title" class="font-1-l">Bem-vindo(a) de volta!</h1>
      <p id="login-description" class="font-2-xs">Primeira vez aqui? <a href="./signin.html">Crie uma conta!</a></p>

      <form id="login-form">
        <input type="email" placeholder="Seu e-mail" class="input-text" id="email">

        <div class="input-senha-wrapper">
          <input type="password" placeholder="Sua senha" class="input-text" id="senha">
          <i class="fa-solid fa-eye-slash toggle-senha" data-target="senha"></i>
        </div>

        <button type="submit" class="btn-login" id="btn-entrar" disabled>Entrar</button>
        <a href="#" id="esqueceu-senha" class="font-1-s">Esqueceu a sua senha?</a>
      </form>
    </div>
  </main>
</body>

</html>
