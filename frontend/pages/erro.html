<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro — BOOSTio</title>
  <link rel="icon" type="image/x-icon" href="../imgs/favicon.webp">
  <link rel="stylesheet" href="../styles/style.css">
  <meta name="description" content="Não foi possível acessar esta página da BOOSTio.">
  <script type="module" src="../js/pages/loading.js" defer></script>
  <script type="module" src="../js/pages/erro.js" defer></script>
</head>

<body id="erro" class="error-page">
  <div id="loading-screen">
    <video id="loading-video" autoplay muted playsinline>
      <source src="../video/loading-toggle.webm" type="video/webm">
    </video>
  </div>
  <div data-site-navigation></div>

  <main id="error-main">
    <section class="error-card" aria-labelledby="error-title">
      <span id="error-code" aria-hidden="true">500</span>
      <h1 id="error-title" class="font-1-xl">Algo não saiu como esperado</h1>
      <p id="error-description" class="font-2-s">Ocorreu um erro inesperado. Tente novamente ou volte à página inicial.</p>
      <div class="error-actions">
        <button type="button" class="btn-ghost" id="error-back" data-page-back><span class="ui-lottie" data-lottie="arrow" data-direction="back" aria-hidden="true"><span class="ui-icon-fallback">→</span></span><span data-back-label>Voltar</span></button>
        <a href="./index.html" class="btn-primary">Ir para o início</a>
      </div>
    </section>
  </main>
</body>

</html>
