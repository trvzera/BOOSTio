<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha</title>
  <link rel="icon" type="image/webp" href="../imgs/favicon.webp">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta name="description" content="Recupere o acesso à sua conta BOOSTio.">
  <script type="module" src="../js/pages/loading.js" defer></script>
  <script type="module" src="../js/pages/esqueci-senha.js" defer></script>
</head>

<body class="forgot-password-page-body">
  <div id="loading-screen">
    <video id="loading-video" autoplay muted playsinline>
      <source src="../video/loading-toggle.webm" type="video/webm">
    </video>
  </div>
  <div data-site-navigation></div>

  <main id="forgot-password-page">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>

    <div id="forgot-password-container">
      <img src="../imgs/logo.webp" alt="Logo">
      <h1 id="forgot-password-title" class="font-1-l">Esqueceu sua senha?</h1>
      <p id="forgot-password-description" class="font-2-xs">Sem problemas. Digite seu e-mail e enviaremos um link para você redefinir sua senha.</p>

      <form id="forgot-password-form">
        <input type="email" placeholder="Seu e-mail" class="input-text" id="email" required>
        <p id="forgot-password-error" class="font-1-xs form-error"></p>
        <button type="submit" class="btn-login" id="btn-send-link" disabled>Enviar link de recuperação</button>
        <a href="./login.html" id="back-to-login" class="font-1-s page-back-link" data-page-back><span class="ui-lottie" data-lottie="arrow" data-direction="back" aria-hidden="true"><span class="ui-icon-fallback">→</span></span><span data-back-label>Voltar ao login</span></a>
      </form>

      <div id="forgot-password-success" class="hidden">
        <div class="modal-icon"><i class="fa-solid fa-envelope-circle-check"></i></div>
        <h2 class="font-1-l">Verifique seu e-mail</h2>
        <p class="font-2-xs">Se existir uma conta associada a <strong id="email-confirmed">seu e-mail</strong>, você receberá um link para redefinir sua senha em instantes.</p>
        <a href="./login.html" class="btn-login" id="back-to-login-success" data-page-back><span class="ui-lottie" data-lottie="arrow" data-direction="back" aria-hidden="true"><span class="ui-icon-fallback">→</span></span><span data-back-label>Voltar ao login</span></a>
      </div>
    </div>
  </main>
</body>

</html>
